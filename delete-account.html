<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Suppression de compte - ELYUS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #25D366;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .info {
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ELYUS</h1>

    <p class="info">
        Vous pouvez demander la suppression de votre compte ELYUS
        et des données personnelles associées.
    </p>

    <form id="deleteForm">

        <label for="username">
            Nom d'utilisateur
        </label>

        <input
            type="text"
            id="username"
            placeholder="Votre nom d'utilisateur"
            required
        >

        <label for="phone">
            Numéro WhatsApp
        </label>

        <input
            type="tel"
            id="phone"
            placeholder="+237 6XX XX XX XX"
            required
        >

        <button type="submit">
            Envoyer la demande
        </button>

    </form>

</div>

<script>

document.getElementById("deleteForm").addEventListener("submit", function(e) {

    e.preventDefault();

    const username =
        document.getElementById("username").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const message =
`DEMANDE DE SUPPRESSION DE COMPTE ELYUS

Nom d'utilisateur : ${username}

Numéro WhatsApp : ${phone}

Je souhaite demander la suppression de mon compte ELYUS
et des données personnelles associées.`;

    const whatsappNumber = "237696969273";

    const url =
        "https://wa.me/" +
        whatsappNumber +
        "?text=" +
        encodeURIComponent(message);

    window.location.href = url;

});

</script>

</body>
</html>
